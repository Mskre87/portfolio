{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
            {{ site.name }} | Software Engineer & Security Researcher
        {% endblock %}
    </title>

    <meta
        name="description"
        content="{% block meta_description %}{{ site.description }}{% endblock %}">

    <meta
        name="keywords"
        content="{{ site.keywords }}">

    <meta
        name="author"
        content="{{ site.author }}">

    <meta
        name="robots"
        content="index, follow">

    <meta
        name="theme-color"
        content="{{ site.theme_color }}">

    <link
        rel="canonical"
        href="https://{{ site.domain }}{{ request.path }}">

    <!-- Open Graph -->

    <meta
        property="og:title"
        content="{% block og_title %}{{ site.name }}{% endblock %}">

    <meta
        property="og:description"
        content="{% block og_description %}{{ site.description }}{% endblock %}">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:url"
        content="https://{{ site.domain }}{{ request.path }}">

    <meta
        property="og:site_name"
        content="{{ site.name }}">

    <meta
        property="og:locale"
        content="{{ site.locale }}">

    <meta
        property="og:image"
        content="https://{{ site.domain }}{{ site.og_image }}">
    
    <meta
        property="og:image:width"
        content="1200">

    <meta
        property="og:image:height"
        content="630">

    <meta
        property="og:image:alt"
        content="{{ site.name }} Portfolio">

    <!-- Twitter -->

    <meta
        name="twitter:card"
        content="summary_large_image">

    <meta
        name="twitter:title"
        content="{% block twitter_title %}{{ site.name }}{% endblock %}">

    <meta
        name="twitter:description"
        content="{% block twitter_description %}{{ site.description }}{% endblock %}">

    <meta
        name="twitter:image"
        content="https://{{ site.domain }}{{ site.og_image }}">

    <!-- Favicons -->

    <link
        rel="icon"
        href="{% static 'favicon/favicon.ico' %}">

    <link
        rel="apple-touch-icon"
        href="{% static 'favicon/apple-touch-icon.png' %}">

    <!-- Styles -->

    <link
        rel="stylesheet"
        href="{% static 'css/main.css' %}">

</head>

<body>

    <a
        href="#main-content"
        class="skip-link">

        Skip to content

    </a>

    {% include "components/navbar.html" %}

    <main id="main-content">

        {% block content %}
        {% endblock %}

    </main>

    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
