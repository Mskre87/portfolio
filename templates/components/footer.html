<footer class="footer">

    <div class="container">

        <div class="footer__content">

            <div class="footer__brand">

                <h2 class="footer__logo">
                    {{ site.name }}<span>.</span>
                </h2>

                <p class="footer__tagline">
                    {{ site.footer_tagline }}
                </p>

            </div>

            <nav class="footer__links" aria-label="Footer navigation">

                {% if site.github %}
                <a href="{{ site.github }}" target="_blank" rel="noopener noreferrer">
                    GitHub
                </a>
                {% endif %}

                {% if site.linkedin %}
                <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">
                    LinkedIn
                </a>
                {% endif %}

                {% if site.credly %}
                <a href="{{ site.credly }}" target="_blank" rel="noopener noreferrer">
                    Credly
                </a>
                {% endif %}

                <button
                    type="button"
                    class="footer__link footer__email-copy"
                    data-email="{{ site.email }}"
                    aria-label="Copy email address {{ site.email }}">

                    Email

                </button>

            </nav>

        </div>

        <div class="footer__bottom">

            <p>{{ site.copyright }}</p>

            <p>
                Built with Django.
            </p>

        </div>

    </div>

    <div
    
    class="copy-toast"
    role="status"
    aria-live="polite"
    aria-atomic="true">

    </div>

</footer>
